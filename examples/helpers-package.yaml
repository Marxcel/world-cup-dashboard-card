input_boolean:
  world_cup_kickoff_alerts_enabled:
    name: World Cup kickoff reminders
    icon: mdi:bell-ring-outline
  world_cup_match_start_alerts_enabled:
    name: World Cup match-start alerts
    icon: mdi:play-circle-outline
  world_cup_final_score_alerts_enabled:
    name: World Cup final-score alerts
    icon: mdi:flag-checkered
  world_cup_speaker_announcements_enabled:
    name: World Cup speaker announcements
    icon: mdi:speaker-message
  world_cup_phone_notifications_enabled:
    name: World Cup phone notifications
    icon: mdi:cellphone-message
  world_cup_goal_alerts_enabled:
    name: World Cup goal alerts
    icon: mdi:soccer
  world_cup_key_event_alerts_enabled:
    name: World Cup key event alerts
    icon: mdi:timeline-alert-outline
  world_cup_penalty_alerts_enabled:
    name: World Cup penalty alerts
    icon: mdi:whistle
  world_cup_red_card_alerts_enabled:
    name: World Cup red-card alerts
    icon: mdi:card
  world_cup_yellow_card_alerts_enabled:
    name: World Cup yellow-card alerts
    icon: mdi:card-outline
  world_cup_favorite_team_alerts_only:
    name: World Cup favorite-team alerts only
    icon: mdi:star-outline
  world_cup_match_day_mode:
    name: World Cup match day mode
    icon: mdi:trophy-outline

input_number:
  world_cup_reminder_minutes:
    name: World Cup reminder minutes
    icon: mdi:timer-alert-outline
    min: 1
    max: 180
    step: 1
    unit_of_measurement: min
    mode: box

input_select:
  world_cup_announcement_player:
    name: World Cup announcement player
    icon: mdi:cast-audio
    options:
      - media_player.your_speaker
      - media_player.your_display
  world_cup_tts_entity:
    name: World Cup TTS voice/service
    icon: mdi:text-to-speech
    options:
      - tts.home_assistant_cloud
      - tts.google_translate_en_com
  world_cup_notification_service:
    name: World Cup notification service
    icon: mdi:bell-badge-outline
    options:
      - notify.mobile_app_your_phone
      - notify.notify
  world_cup_mexico_notification_service:
    name: World Cup Mexico notification service
    icon: mdi:bell-badge-outline
    options:
      - notify.mobile_app_your_phone
      - notify.notify
  world_cup_usa_notification_service:
    name: World Cup USA notification service
    icon: mdi:bell-badge-outline
    options:
      - notify.mobile_app_your_phone
      - notify.notify
  world_cup_completed_results:
    name: World Cup completed results
    icon: mdi:scoreboard-outline
    options:
      - none|No completed results yet
  world_cup_favorite_team:
    name: World Cup favorite team
    icon: mdi:soccer
